<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No Man's Land</title>
<style>
  html, body { margin: 0; height: 100%; background: #12140f; color: #e8e2d0; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  h1 { margin: 0; font-weight: 500; letter-spacing: 0.18em; font-size: 18px; text-transform: uppercase; }
  #wrap { position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  canvas { display: block; background: #2a2418; cursor: crosshair; max-width: 100vw; max-height: 82vh; }
  #hint { font-size: 14px; opacity: .8; max-width: 920px; text-align: center; line-height: 1.45; }
  kbd { font-family: inherit; border: 1px solid #6a624e; padding: 0 5px; border-radius: 3px; }
</style>
</head>
<body>
<h1>No Man's Land</h1>
<div id="wrap"><canvas id="c" width="1100" height="620"></canvas></div>
<p id="hint">Move with <kbd>A</kbd> <kbd>D</kbd> or arrows. <kbd>S</kbd> or down dives into a trench. <kbd>W</kbd> or up climbs out. Click or <kbd>Space</kbd> to fire toward the cursor. Stay low or the other side will cut you down. Clear each wave.</p>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (state === "title" && (e.code === "Enter" || e.code === "Space")) start();
  if (state === "dead" && e.code === "Enter") start();
  if (state === "win" && e.code === "Enter") start();
});
addEventListener("keyup", e => { keys[e.code] = false; });

let mouse = { x: W * 0.7, y: H * 0.45, down: false };
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener("mousedown", () => { mouse.down = true; if (state === "title") start(); });
canvas.addEventListener("mouseup", () => { mouse.down = false; });

const trenches = [
  { x: 70, w: 150 },
  { x: 340, w: 130 },
  { x: 620, w: 140 },
  { x: 880, w: 150 },
];

let state = "title";
let player, enemies, bullets, particles, flashes, shake, wave, score, spawnLeft, last, msgTimer, msg;

function inTrench(x) {
  return trenches.some(t => x > t.x + 18 && x < t.x + t.w - 18);
}

function start() {
  player = {
    x: trenches[0].x + trenches[0].w / 2,
    y: 0,
    vx: 0,
    crouched: true,
    hp: 100,
    ammo: 8,
    mag: 8,
    reload: 0,
    fireCd: 0,
    facing: 1,
  };
  enemies = [];
  bullets = [];
  particles = [];
  flashes = [];
  shake = 0;
  wave = 1;
  score = 0;
  spawnLeft = 0;
  msg = "Wave 1";
  msgTimer = 140;
  state = "play";
  beginWave();
}

function beginWave() {
  spawnLeft = 3 + wave * 2;
  msg = "Wave " + wave;
  msgTimer = 120;
}

function spawnEnemy() {
  const side = Math.random() < 0.72 ? 1 : -1;
  const trench = trenches[1 + Math.floor(Math.random() * (trenches.length - 1))];
  enemies.push({
    x: side > 0 ? W + 30 : -30,
    y: 0,
    hp: 28 + wave * 6,
    max: 28 + wave * 6,
    vx: side > 0 ? -1.1 - Math.random() * 0.6 : 1.1 + Math.random() * 0.6,
    home: trench.x + 30 + Math.random() * (trench.w - 60),
    crouched: false,
    fireCd: 40 + Math.random() * 80,
    alive: true,
  });
  spawnLeft--;
}

function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 18 + Math.random() * 16, color });
  }
}

function shoot(fromX, fromY, toX, toY, friendly, dmg) {
  const dx = toX - fromX, dy = toY - fromY;
  const len = Math.hypot(dx, dy) || 1;
  const sp = friendly ? 16 : 11;
  bullets.push({
    x: fromX, y: fromY,
    vx: dx / len * sp, vy: dy / len * sp,
    friendly, dmg, life: 70,
  });
  flashes.push({ x: fromX, y: fromY, life: 4 });
  if (friendly) shake = Math.max(shake, 3);
}

function playerShoot() {
  if (player.reload > 0 || player.fireCd > 0 || player.ammo <= 0) {
    if (player.ammo <= 0 && player.reload <= 0) player.reload = 70;
    return;
  }
  const muzzleY = player.crouched ? 468 : 400;
  shoot(player.x + player.facing * 16, muzzleY, mouse.x, mouse.y, true, 22);
  player.ammo--;
  player.fireCd = 12;
  if (player.ammo <= 0) player.reload = 75;
}

function update(dt) {
  if (state !== "play") return;
  if (msgTimer > 0) msgTimer--;

  const left = keys.KeyA || keys.ArrowLeft;
  const right = keys.KeyD || keys.ArrowRight;
  const down = keys.KeyS || keys.ArrowDown;
  const up = keys.KeyW || keys.ArrowUp;

  const covered = inTrench(player.x);
  if (down && covered) player.crouched = true;
  if (up) player.crouched = false;
  if (!covered) player.crouched = false;

  const speed = player.crouched ? 1.15 : 3.1;
  player.vx = (right ? speed : 0) - (left ? speed : 0);
  if (player.vx !== 0) player.facing = player.vx > 0 ? 1 : -1;
  player.x += player.vx;
  player.x = Math.max(28, Math.min(W - 28, player.x));

  if (player.fireCd > 0) player.fireCd--;
  if (player.reload > 0) {
    player.reload--;
    if (player.reload === 0) player.ammo = player.mag;
  }
  if (mouse.down || keys.Space) playerShoot();

  if (spawnLeft > 0 && enemies.filter(e => e.alive).length < 4 + Math.floor(wave / 2) && Math.random() < 0.02) {
    spawnEnemy();
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.home - e.x;
    if (Math.abs(dx) > 6) {
      e.x += Math.sign(dx) * Math.min(Math.abs(e.vx), Math.abs(dx));
      e.crouched = false;
    } else {
      e.crouched = true;
      e.fireCd--;
      const exposed = !player.crouched;
      if (e.fireCd <= 0 && exposed) {
        const spread = (Math.random() - 0.5) * 50;
        shoot(e.x, 455, player.x + spread, player.crouched ? 470 : 400, false, 12 + wave);
        e.fireCd = Math.max(28, 90 - wave * 6) + Math.random() * 40;
      } else if (e.fireCd < -40) e.fireCd = 20;
    }
    if (e.hp <= 0) {
      e.alive = false;
      score += 100;
      burst(e.x, 450, "#c4553a", 14, 3.2);
      shake = Math.max(shake, 6);
    }
  }

  for (const b of bullets) {
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.04;
    b.life--;
    if (b.friendly) {
      for (const e of enemies) {
        if (!e.alive) continue;
        const ey = e.crouched ? 470 : 430;
        if (Math.hypot(b.x - e.x, b.y - ey) < 22) {
          if (e.crouched && b.y > 490) continue;
          if (e.crouched && Math.random() < 0.45) {
            burst(b.x, b.y, "#d8c48a", 4, 1.5);
            b.life = 0;
            continue;
          }
          e.hp -= b.dmg;
          burst(b.x, b.y, "#e7d7a1", 6, 2);
          b.life = 0;
        }
      }
    } else {
      const py = player.crouched ? 478 : 410;
      if (Math.hypot(b.x - player.x, b.y - py) < 20) {
        if (player.crouched) {
          burst(b.x, 500, "#8a7a52", 5, 1.4);
          b.life = 0;
        } else {
          player.hp -= b.dmg;
          burst(player.x, py, "#c4553a", 8, 2.4);
          shake = Math.max(shake, 8);
          b.life = 0;
          if (player.hp <= 0) {
            player.hp = 0;
            state = "dead";
          }
        }
      }
    }
    if (b.y > 540) b.life = 0;
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -40 && b.x < W + 40);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; });
  particles = particles.filter(p => p.life > 0);
  flashes.forEach(f => f.life--);
  flashes = flashes.filter(f => f.life > 0);
  if (shake > 0) shake *= 0.86;

  const living = enemies.some(e => e.alive);
  if (!living && spawnLeft <= 0) {
    wave++;
    if (wave > 6) {
      state = "win";
    } else {
      player.hp = Math.min(100, player.hp + 18);
      beginWave();
    }
  }
}

function ground() {
  const g = ctx.createLinearGradient(0, 360, 0, H);
  g.addColorStop(0, "#6d7a45");
  g.addColorStop(0.25, "#5a6236");
  g.addColorStop(1, "#3c3424");
  ctx.fillStyle = g;
  ctx.fillRect(0, 390, W, H - 390);

  ctx.fillStyle = "#7f8c52";
  for (let i = 0; i < 18; i++) {
    ctx.fillRect((i * 73 + 10) % W, 400 + (i % 5) * 3, 28, 3);
  }

  trenches.forEach(t => {
    ctx.fillStyle = "#2a2418";
    ctx.beginPath();
    ctx.moveTo(t.x, 430);
    ctx.lineTo(t.x + 16, 560);
    ctx.lineTo(t.x + t.w - 16, 560);
    ctx.lineTo(t.x + t.w, 430);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#4a4030";
    ctx.fillRect(t.x - 6, 418, 18, 22);
    ctx.fillRect(t.x + t.w - 12, 418, 18, 22);
    ctx.strokeStyle = "#1c1812";
    ctx.stroke();
    // sandbags
    ctx.fillStyle = "#b7a56e";
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(t.x + 8 + i * 18, 408, 16, 10);
      ctx.fillRect(t.x + t.w - 78 + i * 18, 408, 16, 10);
    }
  });

  // barbed suggestion
  ctx.strokeStyle = "rgba(40,36,28,.55)";
  ctx.beginPath();
  for (let x = 0; x < W; x += 8) {
    const y = 392 + Math.sin(x * 0.08) * 3;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, 400);
  g.addColorStop(0, "#8ea0ad");
  g.addColorStop(0.55, "#c5bfa6");
  g.addColorStop(1, "#d9c89a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 400);
  ctx.fillStyle = "rgba(90,90,90,.25)";
  ctx.beginPath();
  ctx.ellipse(180, 90, 70, 18, 0, 0, Math.PI * 2);
  ctx.ellipse(230, 96, 50, 14, 0, 0, Math.PI * 2);
  ctx.ellipse(760, 70, 90, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  // far ridge
  ctx.fillStyle = "#6e6248";
  ctx.beginPath();
  ctx.moveTo(0, 360);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 330 + Math.sin(x * 0.01) * 18 + Math.sin(x * 0.03) * 8);
  ctx.lineTo(W, 400);
  ctx.lineTo(0, 400);
  ctx.fill();
}

function drawSoldier(x, crouched, facing, color, hp, maxHp) {
  ctx.save();
  ctx.translate(x, crouched ? 500 : 445);
  ctx.scale(facing, 1);
  ctx.fillStyle = color;
  // body
  ctx.fillRect(-7, crouched ? -18 : -36, 14, crouched ? 22 : 34);
  ctx.fillStyle = "#d7c4a2";
  ctx.beginPath();
  ctx.arc(0, crouched ? -24 : -44, 7, 0, Math.PI * 2);
  ctx.fill();
  // helmet
  ctx.fillStyle = "#3e4632";
  ctx.beginPath();
  ctx.ellipse(0, crouched ? -28 : -48, 9, 5, 0, Math.PI, 0);
  ctx.fill();
  // rifle
  ctx.fillStyle = "#2b2418";
  ctx.fillRect(4, crouched ? -16 : -30, 26, 3);
  ctx.restore();
  if (maxHp) {
    ctx.fillStyle = "#2a2018";
    ctx.fillRect(x - 14, crouched ? 458 : 392, 28, 4);
    ctx.fillStyle = hp > maxHp * 0.35 ? "#7ea14a" : "#c4553a";
    ctx.fillRect(x - 14, crouched ? 458 : 392, 28 * Math.max(0, hp / maxHp), 4);
  }
}

function hud() {
  ctx.fillStyle = "rgba(18,16,12,.72)";
  ctx.fillRect(16, 16, 220, 64);
  ctx.fillStyle = "#e8e2d0";
  ctx.font = "16px Georgia";
  ctx.fillText("Health", 28, 38);
  ctx.fillStyle = "#3a3024";
  ctx.fillRect(88, 26, 130, 12);
  ctx.fillStyle = player.hp > 35 ? "#8eae52" : "#c4553a";
  ctx.fillRect(88, 26, 130 * (player.hp / 100), 12);
  ctx.fillStyle = "#e8e2d0";
  ctx.fillText("Rounds  " + (player.reload > 0 ? "reloading" : player.ammo + " / " + player.mag), 28, 66);
  ctx.fillStyle = "rgba(18,16,12,.72)";
  ctx.fillRect(W - 180, 16, 164, 40);
  ctx.fillStyle = "#e8e2d0";
  ctx.fillText("Score  " + score, W - 164, 42);

  if (msgTimer > 0) {
    ctx.globalAlpha = Math.min(1, msgTimer / 30);
    ctx.font = "42px Georgia";
    ctx.fillStyle = "#f3ead4";
    ctx.textAlign = "center";
    ctx.fillText(msg, W / 2, 150);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  sky();
  ground();

  if (state !== "title") {
    enemies.forEach(e => {
      if (!e.alive) return;
      drawSoldier(e.x, e.crouched, e.x > player.x ? -1 : 1, "#5c4636", e.hp, e.max);
    });
    drawSoldier(player.x, player.crouched, player.facing, "#3f4d34", null, null);
    // aim line when exposed or peeking
    ctx.strokeStyle = "rgba(232,226,208,.35)";
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    const my = player.crouched ? 468 : 400;
    ctx.moveTo(player.x, my);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  bullets.forEach(b => {
    ctx.strokeStyle = b.friendly ? "#f4e7bf" : "#ffb089";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.6, b.y - b.vy * 0.6);
    ctx.stroke();
  });
  flashes.forEach(f => {
    ctx.fillStyle = "rgba(255,220,140," + (f.life / 4) + ")";
    ctx.beginPath();
    ctx.arc(f.x, f.y, 8, 0, Math.PI * 2);
    ctx.fill();
  });
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  });

  if (state === "play") hud();
  ctx.restore();

  if (state === "title") overlay("No Man's Land", "Dive the trenches. Climb out only to move and to shoot.", "Click or press Enter");
  if (state === "dead") overlay("Cut down", "Score " + score + "   ·   wave " + wave, "Enter to try again");
  if (state === "win") overlay("The line holds", "You cleared the field. Score " + score, "Enter to play again");
}

function overlay(title, sub, foot) {
  ctx.fillStyle = "rgba(16,14,10,.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#f4ead6";
  ctx.textAlign = "center";
  ctx.font = "54px Georgia";
  ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.font = "18px Georgia";
  ctx.fillText(sub, W / 2, H / 2 + 24);
  ctx.globalAlpha = 0.75 + Math.sin(Date.now() / 280) * 0.25;
  ctx.fillText(foot, W / 2, H / 2 + 64);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(32, now - prev);
  prev = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
